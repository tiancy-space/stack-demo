<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>stack-demo 留言板</title>
  <style>
    body { font-family: system-ui, -apple-system, "PingFang SC", sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 1.5rem; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input { flex: 1; padding: 8px; font-size: 1rem; }
    button { padding: 8px 16px; font-size: 1rem; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { border-bottom: 1px solid #eee; padding: 10px 0; }
    time { color: #888; font-size: .85rem; display: block; }
    #status { color: #888; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>stack-demo 留言板</h1>
  <p id="status">加载中…（Render 免费实例休眠时首次访问约需 30 秒）</p>
  <form id="form">
    <input id="content" maxlength="500" placeholder="写一条留言…" required />
    <button type="submit">发送</button>
  </form>
  <ul id="list"></ul>
  <script src="app.js"></script>
</body>
</html>
